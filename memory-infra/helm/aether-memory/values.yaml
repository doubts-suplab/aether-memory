global:
  imageRegistry: "ghcr.io/suplab"
  imagePullPolicy: Always
  nameOverride: ""
  namespaceOverride: "aether-memory"

openshift:
  enabled: false

route:
  host: "memory.aether.apps.cluster.example.com"
  termination: edge
  insecureEdgeTerminationPolicy: Redirect

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  host: memory.aether.local
  path: /
  tls: []

serviceMonitor:
  enabled: false
  namespace: monitoring
  interval: 30s

# ─── memory-api (Shared Memory Platform, port 8083) ───────────────────────────
app:
  image:
    repository: "ghcr.io/suplab/memory-api"
    tag: "0.1.0-SNAPSHOT"

  replicaCount: 2

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  autoscaling:
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

  serviceAccount:
    create: true
    annotations: {}

  # ConfigMap values — non-sensitive runtime configuration.
  config:
    # Ollama embedding runtime.
    ollamaBaseUrl: "http://ollama:11434"
    embeddingEnabled: "true"
    embeddingModel: "all-minilm"
    # Policy-aware lifecycle sweep (decay → archive → retention purge).
    decayEnabled: "true"
    decayCron: "0 0 3 * * *"
    retentionDays: "90"
    # Federation — auth off by default (open standalone); enable per-peer trust in a real fleet.
    federationRequireAuth: "false"
    federationRateLimitBackend: "memory"
    federationRateLimitFailClosed: "false"
    # Redis — only consulted when federationRateLimitBackend=redis (lazy connection).
    redisHost: "aether-memory-redis"
    redisPort: "6379"
    springProfilesActive: "k8s"

  # Name of a pre-existing Secret (External Secrets Operator or kubectl).
  # Expected keys: postgres-url, postgres-user, postgres-password, and optionally
  # federation-auth-token / federation-peer-auth-token when federation auth is enabled.
  secrets:
    existingSecret: "aether-memory-secrets"
