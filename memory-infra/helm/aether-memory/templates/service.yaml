apiVersion: v1
kind: Service
metadata:
  name: aether-memory
  namespace: {{ include "aether-memory.namespace" . }}
  labels:
    {{- include "aether-memory.labels" . | nindent 4 }}
    app.kubernetes.io/component: shared-memory-engine
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aether-memory
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8083
      targetPort: 8083
      protocol: TCP
