{{- if .Values.serviceMonitor.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: aether-memory
  namespace: {{ .Values.serviceMonitor.namespace }}
  labels:
    {{- include "aether-memory.labels" . | nindent 4 }}
    app.kubernetes.io/component: shared-memory-engine
spec:
  namespaceSelector:
    matchNames:
      - {{ include "aether-memory.namespace" . }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aether-memory
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
